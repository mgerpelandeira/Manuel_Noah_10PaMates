<h1>Derivadas</h1>

<p>La derivada mide el cambio de una función.</p>

<h2>Cómo se calculan</h2>
<p>Regla básica: xⁿ → n·xⁿ⁻¹</p>

<h2>Ejemplos</h2>
<p>d/dx (x²) = 2x</p>
<p>d/dx (x³) = 3x²</p>
