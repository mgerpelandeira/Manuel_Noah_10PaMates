<h1>Áreas con integrales</h1>

<p>Las integrales permiten calcular el área bajo una curva en un intervalo.</p>

<h2>Ejemplos</h2>

<p>∫₀² x dx = 2</p>
<p>∫₀¹ x² dx = 1/3</p>

<h2>Practica</h2>

<p>¿Cuál es el área bajo la curva x entre 0 y 2?</p>
