<h1>Límites</h1>

<img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Limit_function.svg" class="tema-img">
    
<p>Un límite es el valor al que se acerca una función cuando x se aproxima a un número.</p>

<h2>Cómo se calculan</h2>
<p>Se sustituye directamente el valor. Si da 0/0, se simplifica.</p>

<h2>Ejemplos</h2>
<p>lim (x→2) (x+3) = 5</p>

<h2>Práctica</h2>
<button onclick="comprobarRespuesta(true)">5</button>
<button onclick="comprobarRespuesta(false)">6</button>
