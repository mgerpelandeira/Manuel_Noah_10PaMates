<body>

<h1>Límites</h1>

<p>Un límite es el valor al que se aproxima una función cuando la variable se acerca a un número.</p>

<h2>Ejemplos</h2>

<p>1. lim (x→2) (x + 3) = 5</p>

<p>2. lim (x→1) (2x) = 2</p>

<p>3. lim (x→0) (x²) = 0</p>

<h2>Practica</h2>

<p>¿Cuál es el resultado?</p>

<p>1. lim (x→3) (x + 2)</p>
<button>5</button>
<button>6</button>

<p>2. lim (x→2) (2x)</p>
<button>4</button>
<button>2</button>

</body>
</html>
